[package]
name = "tv-buddy"
version = "0.1.0"
edition = "2021"
description = "TV Buddy——自托管 IPTV 代理服务"
license = "MIT"
publish = false

[[bin]]
name = "tv-buddy"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
argon2 = "0.5"
arc-swap = "1"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
hex = "0.4"
http-body-util = "0.1"
flate2 = "1"
image-webp = "0.2.4"
png = "0.17.16"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.8"
roxmltree = "0.20"
mime_guess = "2"
notify = "8.2.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "deflate", "brotli", "socks"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
serde_json = "1"
