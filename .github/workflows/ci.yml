name: TV Buddy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 发布产物命名用的产品名。注意：step 的 with: 不支持 env 上下文，
  # 所以 upload-artifact / download-artifact 里用字面量，改名前须一起改。
  PRODUCT_SLUG: tv-buddy

jobs:
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  rust:
    name: 格式、静态检查与测试
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - name: 测试
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: 汇总失败用例
        if: failure()
        run: |
          # 失败用例名写进 annotation：不开日志也能定位（本仓库日志 API 受限）。
          log="$RUNNER_TEMP/test.log"
          [ -f "$log" ] || exit 0
          grep -E '^test .+ FAILED$' "$log" | sed -E 's/^test (.+) \.\.\. FAILED$/\1/' | head -20 |
            while IFS= read -r name; do echo "::error::失败用例：$name"; done
          # 失败摘要（通常含断言信息）打到日志与 annotation。
          grep -A40 '^failures:$' "$log" | head -60 || true
      - name: CLI 冒烟
        run: |
          cargo build
          scripts/smoke-cli.sh

  release:
    name: 发布包 ${{ matrix.name }}
    # 测试全绿后再出包，避免把坏版本发到 Release。
    needs: [frontend, rust]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            name: arm64
            target: aarch64-unknown-linux-musl
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # 版本号直接取 tag。不靠 build.rs 里的 git describe：浅克隆下标签可能取不到，
      # 会退回到 Cargo.toml 的 0.1.0。build.rs 会去掉前导 v。
      TV_BUDDY_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: 安装 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}
      - name: 校验静态链接
        run: |
          BIN="target/${{ matrix.target }}/release/tv-buddy"
          file "$BIN"
          # 不用 ldd：静态 musl 二进制在 glibc 宿主上的输出文案随版本变化
          # （"not a dynamic executable" / "statically linked"），跨 runner 不稳。
          # 直接查 ELF 程序头里有没有 PT_INTERP（值 3），与 scripts/verify-release.sh 同一判据。
          python3 - "$BIN" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as handle:
              head = handle.read(64)
              if head[:4] != b"\x7fELF" or head[4] != 2 or head[5] != 1:
                  sys.exit("不是 ELF64 小端文件")
              phoff = struct.unpack_from("<Q", head, 0x20)[0]
              phentsize = struct.unpack_from("<H", head, 0x36)[0]
              phnum = struct.unpack_from("<H", head, 0x38)[0]
              handle.seek(phoff)
              for _ in range(phnum):
                  entry = handle.read(phentsize)
                  if struct.unpack_from("<I", entry, 0)[0] == 3:
                      sys.exit("存在 PT_INTERP：动态链接")
          print("静态链接 OK")
          PY
      - name: 打包
        run: |
          # 版本取 tag（去掉前缀 v）：$PRODUCT_SLUG-<version>-<arch>.tar.gz[.sha256]
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="${PRODUCT_SLUG}-${VERSION}-${{ matrix.name }}"
          STAGE="out/${NAME}"
          mkdir -p "$STAGE"
          # 包内可执行文件名沿用二进制产物名，安装脚本按它查找。
          install -m 0755 "target/${{ matrix.target }}/release/tv-buddy" "$STAGE/tv-buddy"
          install -m 0644 packaging/tv-buddy.service "$STAGE/tv-buddy.service"
          install -m 0644 packaging/tv-buddy.openrc "$STAGE/tv-buddy.openrc"
          # 把默认发布源换成实际仓库，fork 后不必改脚本（仍可用 --repo 覆盖）。
          for f in install.sh packaging/tv-buddy.sh; do
            out="$STAGE/$(basename "$f")"
            sed "s|TV_BUDDY_REPO:-HasonHuang/TV-Buddy|TV_BUDDY_REPO:-${GITHUB_REPOSITORY}|" "$f" > "$out"
            chmod 0755 "$out"
          done
          grep -q "TV_BUDDY_REPO:-${GITHUB_REPOSITORY}" "$STAGE/install.sh"
          tar -C out -czf "out/${NAME}.tar.gz" "$NAME"
          ( cd out && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          ls -lh out
      - name: 冒烟解包
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="${PRODUCT_SLUG}-${VERSION}-${{ matrix.name }}"
          mkdir -p check
          tar -C check -xzf "out/${NAME}.tar.gz"
          for f in tv-buddy tv-buddy.sh tv-buddy.service tv-buddy.openrc install.sh; do
            [ -f "check/${NAME}/${f}" ] || { echo "包内缺少 ${f}" >&2; exit 1; }
          done
          # 包内二进制必须可执行，且与本次目标架构一致。
          BIN="check/${NAME}/tv-buddy"
          [ -x "$BIN" ] || { echo "包内二进制不可执行" >&2; exit 1; }
          file "$BIN"
          case "${{ matrix.name }}" in
            amd64) file "$BIN" | grep -q "x86-64" ;;
            arm64) file "$BIN" | grep -q "ARM aarch64" ;;
          esac || { echo "包内二进制架构不符：${{ matrix.name }}" >&2; exit 1; }
          # 数据库目录不可写时应报错退出，而不是静默启动。
          if "$BIN" /nonexistent/tv-buddy.db >/dev/null 2>&1; then
            echo "数据库不可写时不应退出码为 0" >&2
            exit 1
          fi
          # 旧参数（config.toml）必须被明确拒绝。
          if "$BIN" /nonexistent/config.toml >/dev/null 2>&1; then
            echo "旧配置路径应被拒绝" >&2
            exit 1
          fi
          echo "包内容 OK"
      - uses: actions/upload-artifact@v4
        with:
          name: tv-buddy-${{ matrix.name }}
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release-macos:
    name: 发布包 macOS arm64
    needs: [frontend, rust]
    runs-on: macos-15
    env:
      TV_BUDDY_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: 构建
        run: cargo build --release --target aarch64-apple-darwin
      - name: 校验架构
        run: |
          BIN="target/aarch64-apple-darwin/release/tv-buddy"
          file "$BIN"
          file "$BIN" | grep -q "arm64"
          "$BIN" version
      - name: 冒烟运行
        run: |
          set -eu
          BIN="target/aarch64-apple-darwin/release/tv-buddy"
          DB="$RUNNER_TEMP/tv-buddy-smoke.db"
          # 固定回环地址与高位端口，避免与 runner 上其他服务冲突。
          "$BIN" config set server.bind '"127.0.0.1:19876"' --db "$DB" >/dev/null
          "$BIN" "$DB" &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ok=0
          i=0
          while [ "$i" -lt 30 ]; do
            if curl -fsS -o /dev/null "http://127.0.0.1:19876/health"; then ok=1; break; fi
            sleep 1
            i=$((i + 1))
          done
          kill "$PID" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            cat "$RUNNER_TEMP"/*.log 2>/dev/null || true
            echo "健康检查失败" >&2
            exit 1
          fi
          echo "健康检查通过"
      - name: 打包
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="${PRODUCT_SLUG}-${VERSION}-macos-arm64"
          mkdir -p "out/${NAME}"
          install -m 0755 "target/aarch64-apple-darwin/release/tv-buddy" "out/${NAME}/tv-buddy"
          {
            printf '%s\n' "TV Buddy ${VERSION} macOS arm64"
            printf '%s\n' ""
            printf '%s\n' "运行："
            printf '%s\n' "  chmod +x tv-buddy"
            printf '%s\n' "  ./tv-buddy ./tv-buddy.db"
            printf '%s\n' ""
            printf '%s\n' "面板：http://127.0.0.1:9900/panel"
            printf '%s\n' "初始口令：./cache/admin_initial_credentials.txt"
            printf '%s\n' ""
            printf '%s\n' "说明："
            printf '%s\n' "- 未签名。首次运行如被 Gatekeeper 拦截，执行："
            printf '%s\n' "  xattr -d com.apple.quarantine ./tv-buddy"
            printf '%s\n' "- 数据目录为当前目录。请把 tv-buddy.db 放在用户目录下。"
            printf '%s\n' "- install.sh 只支持 Linux。macOS 直接运行二进制。"
            printf '%s\n' "- DASH 录制与素材转换需要 ffmpeg 在 PATH 中。"
            printf '%s\n' "- EPG 脚本默认调用 python3；请安装 Python 并确保命令名为 python3。"
          } > "out/${NAME}/README.txt"
          tar -C out -czf "out/${NAME}.tar.gz" "$NAME"
          ( cd out && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: tv-buddy-macos-arm64
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布 Release
    needs: [release, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 更新说明要翻上一个 tag 到本 tag 的提交历史，浅克隆拿不到。
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tv-buddy-*
          path: dist
          merge-multiple: true
      - name: 列出产物
        run: ls -lh dist
      # 复用 git-cliff：按 Conventional Commits 与 cliff.toml 的模板生成说明，
      # 不再自己维护解析脚本。--latest 取最新 tag 到上一 tag 之间的提交。
      - name: 生成更新说明
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          # 标题就用 tag 本身（列表里显示 v2026.x.y）。显式写死是必要的：
          # 该 action 更新已存在的 release 时是 `input_name || existing.name || tag`，
          # 省略 name 会保留旧标题，改不回来。
          name: ${{ github.ref_name }}
          files: dist/*
          # 用 git-cliff 生成的说明，不再让 GitHub 自动生成。
          body_path: NOTES.md
          fail_on_unmatched_files: true
          # 带后缀的 tag（如 -beta.1）发布为预发布，不会被 /releases/latest 选中。
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Docker Hub 镜像。
  #
  # 多架构用原生 runner 各编译一次。不要用 QEMU 模拟 arm64 跑 Rust：
  # release 配置开了 LTO，模拟构建会非常慢，容易超过作业时限。
  # 两个架构先按 digest 推送，再由 docker-merge 合成 manifest。
  #
  # 仓库 Secrets 需要配置：
  #   DOCKERHUB_USERNAME   Docker Hub 用户名
  #   DOCKERHUB_TOKEN      Docker Hub 访问令牌（Read & Write）
  # 镜像名固定为 <DOCKERHUB_USERNAME>/tv-buddy。
  docker-build:
    name: Docker 镜像 ${{ matrix.arch }}
    needs: release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tv-buddy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送 ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            TV_BUDDY_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=TV Buddy
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          # 按 digest 推送，不带 tag。合并阶段再统一打 tag。
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # 关闭 provenance/SBOM。开启时 digest 指向带附加清单的 index，
          # 两个架构再合并会得到嵌套 index，Docker 拉取时可能无法解析。
          provenance: false
          sbom: false
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: 记录 digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          [ -n "$DIGEST" ] || { echo "构建没有返回 digest" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}.txt"
          cat "$RUNNER_TEMP/digests/${{ matrix.arch }}.txt"
      - name: 冒烟运行
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          cid=$(docker run -d --platform "linux/${{ matrix.arch }}" "$IMAGE@$DIGEST")
          ok=0
          i=0
          # 健康检查在镜像里定义了 start-period=10s、interval=30s。
          # 最多等 60s，够启动并完成一次探测。
          while [ "$i" -lt 30 ]; do
            status=$(docker inspect -f \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              "$cid")
            [ "$status" = healthy ] && { ok=1; break; }
            [ "$status" = exited ] && break
            sleep 2
            i=$((i + 1))
          done
          if [ "$ok" -ne 1 ]; then
            docker logs "$cid" || true
            docker rm -fv "$cid" >/dev/null 2>&1 || true
            echo "容器健康检查未通过：${status:-unknown}" >&2
            exit 1
          fi
          docker rm -fv "$cid" >/dev/null
          echo "健康检查通过"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Docker 合并多架构
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 合并 manifest 并打标签
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tv-buddy
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          sources=$(cat "$RUNNER_TEMP"/digests/*.txt)
          [ -n "$sources" ] || { echo "没有可合并的 digest" >&2; exit 1; }
          # 镜像版本号与发布包一致，去掉 tag 的前导 v。
          set -- -t "${IMAGE}:${version}" -t "${IMAGE}:${GITHUB_REF_NAME}"
          # 预发布 tag（含 -）不打 latest。
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) set -- "$@" -t "${IMAGE}:latest" ;;
          esac
          # $sources 必须按空白拆分，才能一次传入多个 digest。
          # shellcheck disable=SC2086
          docker buildx imagetools create "$@" $sources
          docker buildx imagetools inspect "${IMAGE}:${version}"
