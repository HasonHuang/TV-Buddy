# =========================================================
# 后端连接池
# 复用后端长连接，减少反复建连的开销。
# 用 127.0.0.1 而非 localhost，避免解析成 ::1 导致 502。
# =========================================================

# sontv：另一个项目，监听 9911。
upstream sontv {
    server 127.0.0.1:9911;
    keepalive 32;
}

# tv-buddy：本项目，监听 9900。
upstream tvbuddy {
    server 127.0.0.1:9900;
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # 生产环境建议启用 HTTPS
    # listen              443 ssl;
    # listen              [::]:443 ssl;
    # http2               on;
    # ssl_certificate     /etc/nginx/ssl/example.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/example.com.key;

    # access_log /var/log/nginx/sontv.access.log;
    # error_log  /var/log/nginx/sontv.error.log warn;

    # =========================================================
    # 路径分流
    #
    # 1. 精确匹配 /sub、/proxy、/play，转给 sontv（9911）。
    #    用正则 "~" 加 "$" 锚点，只匹配这一个 URL。
    #    /sub/xxx、/subx 都不命中，避免误转发。
    #
    # 2. 其余路径全转给本项目 tv-buddy（9900）。
    #    本项目的订阅地址是 /sub/<令牌>/playlist.m3u。
    #    它不匹配上面的精确 /sub，因此落到这里，转发到 9900。
    #    面板 /panel、健康检查 /health、播放 /pg /pm 等也在这里。
    #
    # 两个 location 的 proxy_pass 都不带 URI 部分。
    # Nginx 原样透传完整原始 URI。
    # 例：/sub?token=aa  ->  127.0.0.1:9911/sub?token=aa
    # 查询串自动保留，无需额外配置。
    # =========================================================
    location ~ ^/(sub|proxy|play)$ {
        proxy_pass http://sontv;

        # ---- 使用 HTTP/1.1，才能启用 keepalive 和 WebSocket ----
        proxy_http_version 1.1;

        # ---- 传递真实客户端信息，便于后端日志/风控 ----
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # ---- 超时设置 ----
        proxy_connect_timeout 5s;    # 与后端建连超时
        proxy_send_timeout    60s;   # 向后端发送请求超时
        proxy_read_timeout    60s;   # 等待后端响应超时，SSE 需调大

        # ---- 缓冲 ----
        proxy_buffering         off;  # 流式/SSE 必须关闭；纯接口可改为 on
        proxy_request_buffering off;  # 请求体立即转发，适合大包/流

        # ---- 其他 ----
        proxy_redirect    off;        # 避免后端内网地址出现在 Location 响应头
        proxy_hide_header X-Powered-By;
        client_max_body_size 10m;
    }

    # 其余路径：本项目 tv-buddy（9900）。
    # 面板、订阅、播放、健康检查都走这里。
    location / {
        proxy_pass http://tvbuddy;

        # ---- 使用 HTTP/1.1 ----
        proxy_http_version 1.1;

        # 清空 Connection 请求头，upstream keepalive 才生效。
        # 上游没有 WebSocket，因此不影响升级握手。
        proxy_set_header Connection        "";

        # ---- 传递真实客户端信息 ----
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # ---- 超时设置 ----
        proxy_connect_timeout 5s;    # 与后端建连超时
        proxy_send_timeout    300s;  # 备份恢复可上传 64MB，给足时间
        proxy_read_timeout    300s;  # 订阅解析脚本的上限是 300s

        # ---- 缓冲 ----
        proxy_buffering         off;  # HLS/DASH 切片是流式响应，必须关闭
        proxy_request_buffering off;  # 请求体立即转发

        # ---- 其他 ----
        proxy_redirect    off;        # 保留后端 302 的原始 Location
        proxy_hide_header X-Powered-By;
        client_max_body_size 64m;     # 与后端恢复接口的 64MB 上限一致
    }
}
