<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="96" height="96" role="img" aria-label="TV Buddy 台标">
  <title>TV Buddy 台标</title>
  <!-- 白色底板让图形在浅色与深色背景上都可读。 -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="#ffffff" stroke="#e3e3e8" />
  <!-- 丷 形天线 -->
  <g fill="none" stroke="#16203a" stroke-width="3" stroke-linecap="round">
    <path d="M24 15 20.5 7.5" />
    <path d="M40 15 43.5 7.5" />
  </g>
  <!-- 空心机身 -->
  <rect x="10" y="15" width="44" height="32" rx="9" fill="none" stroke="#16203a" stroke-width="3" />
  <!-- 三色屏：蓝、绿、红 -->
  <rect x="16" y="21" width="8" height="20" rx="2.6" fill="#1d3fd8" />
  <rect x="28" y="21" width="8" height="20" rx="2.6" fill="#17a34a" />
  <rect x="40" y="21" width="8" height="20" rx="2.6" fill="#ff3b30" />
</svg>
